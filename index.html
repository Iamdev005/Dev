<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEV EDITS // ITACHI PORTFOLIO</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050608;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      touch-action: none;
    }

    .viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Video Background Layer */
    #itachiVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    /* Edge Gradient */
    .edge-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,6,8,0.75) 0%, rgba(5,6,8,0) 25%, rgba(5,6,8,0.65) 60%, rgba(5,6,8,0.95) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Top Bar Navigation */
    .top-bar {
      position: absolute;
      top: 25px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 40;
      pointer-events: none;
    }

    .brand-tag {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ef4444;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
    }

    /* Headline Overlay */
    .headline-wrap {
      position: absolute;
      top: 9vh;
      left: 6vw;
      z-index: 25;
      max-width: 80vw;
      pointer-events: none;
    }

    .headline-wrap h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.9rem, 5.2vw, 3.4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }

    .headline-wrap h1 span {
      color: #ef4444;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
    }

    /* Bottom Subtitles & Promo Container */
    .bottom-info {
      position: absolute;
      bottom: 92px;
      left: 6vw;
      right: 6vw;
      z-index: 25;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quote-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ef4444;
      text-transform: uppercase;
    }

    .quote-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }

    .dialogue-text {
      font-size: clamp(0.9rem, 2.4vw, 1.15rem);
      font-weight: 600;
      line-height: 1.4;
      color: #f1f5f9;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      max-width: 540px;
    }

    /* Promo Subtext */
    .cta-subtext {
      font-size: 0.78rem;
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .cta-subtext b {
      color: #ef4444;
    }

    /* Floating Social Dock */
    .social-dock {
      position: absolute;
      bottom: 22px;
      left: 6vw;
      right: 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      pointer-events: auto;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(18, 20, 26, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e2e8f0;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .social-btn:hover, .social-btn:active {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .contact-btn {
      background: #ef4444;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.45);
      transition: all 0.25s ease;
    }

    .contact-btn:hover, .contact-btn:active {
      background: #dc2626;
      transform: scale(1.04);
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.8);
    }

    /* Watermark */
    .watermark-bg {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 3vw 8vh 3vw;
      font-family: 'Syne', sans-serif;
      font-size: clamp(5.5rem, 18vw, 18rem);
      font-weight: 800;
      color: rgba(255, 255, 255, 0.04);
      line-height: 0.75;
      letter-spacing: -4px;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }
  </style>
</head>
<body>

        <a href="https://instagram.com/i_am_dev_005" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram Profile">

            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>

  </div>

  <script>
    const video = document.getElementById('itachiVideo');
    const watermark = document.getElementById('watermark');
    const headlineWrap = document.getElementById('headlineWrap');
    const quoteBadge = document.getElementById('quoteBadge');
    const dialogueText = document.getElementById('dialogueText');
    const ctaSubtext = document.getElementById('ctaSubtext');

    let videoDuration = 0;
    let touchStartY = 0;
    let lastTouchY = 0;
    let activeDirection = 0;
    let glideTimer = 0;
    let lastTime = performance.now();

    video.addEventListener('loadedmetadata', () => {
      videoDuration = video.duration || 13;
      video.currentTime = 0.01;
    });

    // Touch Controls
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.social-dock')) return;
      touchStartY = e.touches[0].clientY;
      lastTouchY = touchStartY;
      glideTimer = 0;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('.social-dock') || !videoDuration) return;
      e.preventDefault();

      const currentY = e.touches[0].clientY;
      const deltaY = lastTouchY - currentY;
      lastTouchY = currentY;

      if (deltaY > 1.5) {
        activeDirection = 1;
        glideTimer = 45;
      } else if (deltaY < -1.5) {
        activeDirection = -1;
        glideTimer = 45;
      }
    }, { passive: false });

    // Desktop Controls
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.social-dock')) return;
      touchStartY = e.clientY;
      lastTouchY = touchStartY;
      glideTimer = 0;
      isMouseDown = true;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || !videoDuration) return;
      const deltaY = lastTouchY - e.clientY;
      lastTouchY = e.clientY;

      if (deltaY > 1.5) {
        activeDirection = 1;
        glideTimer = 45;
      } else if (deltaY < -1.5) {
        activeDirection = -1;
        glideTimer = 45;
      }
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    // 1.0X Playback + Scene Dialogue Sync
    function syncExperience(now) {
      const deltaSeconds = (now - lastTime) / 1000;
      lastTime = now;

      if (glideTimer > 0 && videoDuration > 0) {
        glideTimer--;

        if (activeDirection === 1) {
          if (video.paused) {
            video.playbackRate = 1.0;
            video.play().catch(() => {});
          }
        } else if (activeDirection === -1) {
          if (!video.paused) video.pause();
          video.currentTime = Math.max(0, video.currentTime - deltaSeconds * 1.0);
        }
      } else {
        if (!video.paused) video.pause();
        activeDirection = 0;
      }

      if (videoDuration > 0) {
        const progress = Math.min(Math.max(video.currentTime / videoDuration, 0), 1);

        if (progress < 0.35) {
          quoteBadge.innerText = "SHADOW OF PEACE";
          dialogueText.innerText = '"Self-sacrifice... a nameless shinobi who protects peace within its shadow."';
          ctaSubtext.innerHTML = '✨ Want a custom anime video edit or website like this? <b>DM me on Instagram!</b>';
        } else if (progress >= 0.35 && progress < 0.70) {
          quoteBadge.innerText = "MANGEKYO SHARINGAN";
          dialogueText.innerText = '"You are already caught in my Genjutsu."';
          ctaSubtext.innerHTML = '🔥 Get your own viral interactive anime site — <b>Contact Now!</b>';
        } else {
          quoteBadge.innerText = "LET'S WORK TOGETHER";
          dialogueText.innerText = '"Agar aap bhi aisi interactive website ya video edit banwana chahte hain, toh connect karein."';
          ctaSubtext.innerHTML = '🚀 Ready to build something epic? <b>Tap DM FOR WORK below.</b>';
        }

        headlineWrap.style.transform = `translateY(${-progress * 40}px)`;
        watermark.style.transform = `translateY(${progress * 30}px)`;
      }

      requestAnimationFrame(syncExperience);
    }

    requestAnimationFrame(syncExperience);
  </script>
</body>
