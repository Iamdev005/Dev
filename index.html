<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevEditx | Official Portfolio & App</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #ff0055, #7928ca, #00dfd8);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #1a1a24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      color: #ff007f;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 1px;
      color: #fff;
    }

    p.tagline {
      font-size: 14px;
      color: #a0a0b2;
      line-height: 1.5;
    }

    .download-card {
      width: 100%;
      background: linear-gradient(145deg, #1b1b26, #14141e);
      border: 1px solid #2d2d3f;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .download-card h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #00dfd8;
    }

    .download-card p {
      font-size: 13px;
      color: #9a9ab0;
      margin-bottom: 16px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
    }

    .links-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      background-color: #171722;
      border: 1px solid #262638;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .link-item:hover {
      background-color: #202030;
      border-color: #7928ca;
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 12px;
      color: #606075;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar-wrapper">
      <div class="avatar">DX</div>
    </div>

    <div>
      <h1>DEV EDITX</h1>
      <p class="tagline">Anime Edits • Visual Showcase • Video Production</p>
    </div>

    <!-- Direct App Download Section -->
    <div class="download-card">
      <h2>Official Android App</h2>
      <p>Direct download and install the official DevEditx App.</p>
      <a href="https://github.com/iamdev005/Dev/releases/latest/download/DevEditx.apk" class="download-btn">
        <span>⚡</span> Download APK (v1.0.0)
      </a>
    </div>

    <!-- Portfolio & Social Media Links -->
    <div class="links-section">
      <a href="https://github.com/iamdev005/Dev/releases/latest" class="link-item" target="_blank">
        📦 View GitHub Releases
      </a>
      <a href="https://youtube.com/@dev_editx_1" class="link-item" target="_blank">
        ▶ YouTube Channel
      </a>
      <a href="https://instagram.com/i_am_dev_005" class="link-item" target="_blank">
        📷 Instagram Profile
      </a>
    </div>

    <footer>
      © 2026 DEV EDITX. All rights reserved.
    </footer>
  </div>

</body>
</html>
